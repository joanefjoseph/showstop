services:
  api:
    image: node:20-alpine
    container_name: showstop-api
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/showstop
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      LABEL_API_SECRET: ${LABEL_API_SECRET:-replace_with_real_secret}
      MOCK_FAN_VERIFY: "true"
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: showstop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: showstop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: showstop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
