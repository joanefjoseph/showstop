<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LinkedIn DM Assistant</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:980px;margin:0 auto;padding:16px 20px 80px;background:#f4f2ee;color:#1d1d1d}
  nav{display:flex;gap:18px;align-items:center;margin-bottom:12px}
  nav a{color:#0a66c2;text-decoration:none;font-weight:600}
  .card{background:#fff;border-radius:10px;padding:16px;margin:14px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .card.done{opacity:.45}
  .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tag{font-size:12px;padding:2px 9px;border-radius:10px;background:#e8f0fa;color:#0a66c2}
  .tag.warn{background:#fff4e0;color:#915907}
  textarea{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:10px;border:1px solid #ccc;border-radius:8px;margin-top:8px}
  button{font:inherit;padding:7px 15px;border-radius:18px;border:1px solid #0a66c2;background:#fff;color:#0a66c2;cursor:pointer}
  button.primary{background:#0a66c2;color:#fff}
  button.ghost{border-color:#999;color:#666}
  button:disabled{opacity:.5;cursor:default}
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .actions input{flex:1;min-width:200px;padding:7px 12px;border:1px solid #ccc;border-radius:18px;font:inherit}
  .muted{color:#666;font-size:13px}
  .convo{max-height:320px;overflow:auto;background:#fafafa;border-radius:8px;padding:8px 12px;margin:6px 0}
  .msg{margin:8px 0;white-space:pre-wrap}
  .msg.me{color:#555}
  .status{margin-top:6px;font-size:14px}
  .status.ok{color:#057642}.status.err{color:#b42318}
  .error{color:#b42318;font-size:14px}
  .flash{background:#fff;border-left:4px solid #0a66c2;padding:8px 12px;margin:8px 0}
  .warnbox{background:#fff4e0;border-left:4px solid #d98c00;padding:8px 12px;margin:8px 0}
  table{border-collapse:collapse;width:100%;font-size:14px}
  td,th{text-align:left;padding:4px 8px;border-bottom:1px solid #eee}
</style>
</head>
<body>
<nav>
  <strong>Business DM Assistant</strong>
  <a href="{{ url_for('index') }}">Drafts</a>
  <a href="{{ url_for('context_page') }}">Context</a>
  <a href="{{ url_for('outreach_page') }}">New outreach</a>
</nav>
{% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
{% block body %}{% endblock %}
<script>
const GEMINI_WEB_URL = 'https://gemini.google.com/app';

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}

function copyWithFallback(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return ok;
}

// Export: (1) download the JSON file, (2) copy instructions to the clipboard, (3) open Gemini.
async function exportToGemini(url, body, statusEl) {
  const show = (html, cls) => { if (statusEl) { statusEl.innerHTML = html; statusEl.className = 'status ' + (cls || ''); } };
  show('Preparing export…');
  let r, data = {};
  try {
    r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
    data = await r.json();
  } catch (e) { show('Export failed: ' + escapeHtml(e), 'err'); return false; }
  if (!r.ok) { show(escapeHtml(data.error || 'Export failed.'), 'err'); return false; }

  // Copy first, while this tab still has focus.
  let copied = false;
  try { await navigator.clipboard.writeText(data.clipboard); copied = true; }
  catch (e) { copied = copyWithFallback(data.clipboard); }

  // Download the JSON file.
  const blob = new Blob([JSON.stringify(data.export, null, 2)], {type: 'application/json'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = data.filename;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 60000);

  // Open Gemini in a new tab.
  const w = window.open(GEMINI_WEB_URL, '_blank');
  if (w) w.opener = null;

  const lines = [
    `✓ Downloaded <b>${escapeHtml(data.filename)}</b> (${data.export.items.length} item(s))`,
    copied ? '✓ Copied the instructions to your clipboard' : '⚠ Couldn\'t copy automatically - copy the text below',
    w ? '✓ Opened Gemini in a new tab' : `⚠ Pop-up blocked - <a href="${GEMINI_WEB_URL}" target="_blank" rel="noopener">open Gemini</a>`,
    'In Gemini: paste (Ctrl/Cmd+V), attach the downloaded file, send. Then copy Gemini\'s JSON answer and paste it into <b>Import results from Gemini web</b> on the Drafts page.',
  ];
  show(lines.join('<br>') + (copied ? '' : `<textarea rows="8" style="margin-top:8px">${escapeHtml(data.clipboard)}</textarea>`), 'ok');
  return true;
}
</script>
</body>
</html>
